inspection.blocking.client.display.name=Blocking route called with async WebClient in test
inspection.blocking.client.kotlin.display.name=Blocking route called with async WebClient in test (Kotlin)
inspection.blocking.client.description=Warns when async WebClient calls a route marked @Blocking inside JUnit tests that use @RegisterExtension ServerExtension. Request paths must be string literals, compile-time-folded expressions, or compile-time constants (Java static final / Kotlin const val); interpolated or runtime paths are not checked.
inspection.blocking.client.problem=Route {0} is marked @Blocking; use blockingWebClient() in tests instead of async WebClient.
inspection.missing.blocking.display.name=Blocking call on Armeria event loop
inspection.missing.blocking.kotlin.display.name=Blocking call on Armeria event loop (Kotlin)
inspection.missing.blocking.description=Warns when an annotated Armeria service method, gRPC ImplBase override, HttpService / AbstractHttpService handler, or GraphQL DataFetcher registered through a GraphqlService builder chain calls a known blocking API (Thread.sleep, CompletableFuture.join, Future.get, JDBC, java.nio.file.Files reads/writes) on that method's own execution path. Annotated and gRPC methods are skipped when they already have @Blocking or @NonBlocking. GraphQL and HttpService handlers still warn when @Blocking is present, because Armeria does not honor that annotation there; @NonBlocking still means the call is intentional. Calls inside lambdas, anonymous classes, or nested types are skipped, except GraphQL DataFetcher lambdas passed to dataFetcher(). Heuristics prefer those APIs over arbitrary I/O. GraphQL warnings are omitted when the same GraphqlService builder calls useBlockingTaskExecutor(true). A quick-fix adds @Blocking on annotated or gRPC methods, or on the class when every inspected annotated/gRPC method is blocking.
inspection.missing.blocking.problem={0} may block the event loop; annotate the method or class with @Blocking (or @NonBlocking if this is intentional).
inspection.missing.blocking.problem.graphql={0} may block the event loop; call useBlockingTaskExecutor(true) on the GraphqlService builder, or avoid known blocking APIs in this DataFetcher (@NonBlocking if this is intentional).
inspection.missing.blocking.problem.httpservice={0} may block the event loop; run this work on a blocking executor, or avoid known blocking APIs (@NonBlocking if this is intentional).
inspection.missing.blocking.quickfix.family=Add @Blocking
inspection.missing.blocking.quickfix.method=Annotate method with @Blocking
inspection.missing.blocking.quickfix.class=Annotate class with @Blocking
inspection.missing.blocking.graphql.executor=GraphqlService DataFetchers may block the event loop; call useBlockingTaskExecutor(true) on this builder, or avoid known blocking APIs in fetchers.
inspection.decorator.order.display.name=Armeria client decorator order
inspection.decorator.order.kotlin.display.name=Armeria client decorator order (Kotlin)
inspection.decorator.order.description=Decorator order on WebClient (and RestClient / BlockingWebClient) changes behavior. The last decorator added is invoked first (outermost). LoggingClient then RetryingClient logs every retry attempt; RetryingClient then LoggingClient logs only the first request and last response. CircuitBreakerClient then RetryingClient records every attempt; the reverse records only the overall session. This inspection does not reorder decorators.
inspection.decorator.order.logging.after.retry=LoggingClient is applied after RetryingClient, so only the first request and last response are logged. Apply LoggingClient before RetryingClient to log every retry attempt.
inspection.decorator.order.circuit.after.retry=CircuitBreakerClient is applied after RetryingClient, so the circuit breaker only sees the overall retry session. Apply CircuitBreakerClient before RetryingClient so every attempt is recorded.
inspection.server.decorator.display.name=Armeria server decorator order and GrpcService registration
inspection.server.decorator.kotlin.display.name=Armeria server decorator order and GrpcService registration (Kotlin)
inspection.server.decorator.description=Decorator order and how HttpServiceWithRoutes (such as GrpcService) is registered change behavior. Decorating a GrpcService with decorate() and then calling ServerBuilder.service() without a path drops the service's built-in routes; use service(grpcService, decorator) instead. gRPC-Web browser clients need CorsService so preflight OPTIONS and GrpcHeaderNames are allowed. AuthService applied after LoggingService is outermost, so auth failures may not be logged. This inspection does not reorder decorators or rewrite service() registrations.
inspection.server.decorator.service.with.routes=Decorating an HttpServiceWithRoutes (such as GrpcService) with decorate() and passing it to service() without a path drops path-less routes. Use ServerBuilder.service(grpcService, decorator) instead.
inspection.server.decorator.grpc.cors=GrpcService is registered without a CorsService decorator. Browser gRPC-Web clients send preflight OPTIONS and need CorsService to allow GrpcHeaderNames.
inspection.server.decorator.auth.after.logging=AuthService is applied after LoggingService, so auth failures may not be logged. Apply AuthService before LoggingService so logging is outermost. This inspection does not reorder decorators.
inspection.parameters.flag.display.name=Armeria @Param needs javac -parameters
inspection.parameters.flag.kotlin.display.name=Armeria @Param needs compiler parameter names (Kotlin)
inspection.parameters.flag.description=Armeria @Param without an explicit name uses the compiled parameter name. Java needs javac -parameters in the module compiler additional options or the module's own build.gradle / build.gradle.kts JavaCompile.options.compilerArgs. Kotlin needs javaParameters.set(true) / -java-parameters in that script. Parent convention plugins are not scanned. The inspection is silent when that option is present or when every @Param has an explicit name.
inspection.parameters.flag.problem=@Param without a name requires javac -parameters so the parameter name is retained. Add -parameters to the compiler arguments, or set value on @Param.
inspection.parameters.flag.kotlin.problem=@Param without a name requires Kotlin javaParameters (-java-parameters) so the parameter name is retained. Enable javaParameters, or set value on @Param.
inspection.annotation.processor.display.name=Armeria DocService annotation processor missing
inspection.annotation.processor.kotlin.display.name=Armeria DocService annotation processor missing (Kotlin)
inspection.annotation.processor.description=Reports annotated service methods whose Javadoc or KDoc contains @param, @return, or @throws when armeria-annotation-processor is not on the compile classpath. DocService uses those tags only through the processor. @Description is a runtime annotation and does not need it. The inspection is silent when DocumentationProcessor resolves or a Gradle script in the module mentions armeria-annotation-processor.
inspection.annotation.processor.javadoc.problem=Javadoc or KDoc @param/@return/@throws on this annotated service require armeria-annotation-processor on the compile classpath for DocService.
inspection.missing.docservice.display.name=Armeria server is missing DocService
inspection.missing.docservice.kotlin.display.name=Armeria server is missing DocService (Kotlin)
inspection.missing.docservice.description=Reports Server.builder() (or ArmeriaServerConfigurator) registrations that expose annotated or RPC services without a DocService. Off by default. Enable it when you want an information-level reminder to mount DocService for the debug form.
inspection.missing.docservice.problem=This server registers annotated or RPC services without DocService. Mount DocService (for example serviceUnder("/docs", DocService.builder().build())) so Route Explorer can open debug-form URLs.
