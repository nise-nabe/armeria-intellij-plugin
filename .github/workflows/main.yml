name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:

jobs:
  unit-tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Wizard tests
            task: :plugin-wizard:test
          - name: Plugin test support tests
            task: :plugin-test-support:test
          - name: Plugin explorer tests
            task: :plugin-explorer:test
          - name: Plugin inspection tests
            task: :plugin-inspections:test
          - name: Route model + collectors fast tests
            task: :plugin-route-collectors:fastTest
          - name: Route spring fast tests
            task: :plugin-route-spring:fastTest
          - name: Route protocol fast tests
            task: :plugin-route-protocol:fastTest
          - name: Route analysis fast tests
            task: :plugin-route-analysis:fastTest
          - name: Route collectors platform tests
            task: :plugin-route-collectors:test
          - name: Route spring platform tests
            task: :plugin-route-spring:test
          - name: Route protocol platform tests
            task: :plugin-route-protocol:test
          - name: Route analysis platform tests
            task: :plugin-route-analysis:test
          - name: Plugin tests
            task: :plugin:test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - run: ./gradlew ${{ matrix.task }}

  verify-20263:
    name: Verify 2026.3 Beta
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      # Report-only. Not part of check, so the ubuntu/windows/macos build matrix does not
      # download the 2026.3 IDE archive.
      - run: ./gradlew :plugin:verifyPlugin20263

  build:
    name: Build
    needs: unit-tests
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        java-version: [ 25 ]
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      # Ubuntu already runs the split unit/platform test matrix above. Run the full test
      # suite on Windows and macOS so OS-specific path, VFS, and process behavior is covered.
      - if: matrix.os == 'ubuntu-latest'
        run: ./gradlew build -x test
      - if: matrix.os != 'ubuntu-latest'
        run: ./gradlew build
