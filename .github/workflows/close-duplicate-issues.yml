name: Close duplicate issues

on:
  workflow_dispatch:

concurrency:
  group: close-duplicate-issues
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  close-duplicates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Close duplicate and resolved issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/close-duplicate-issues.sh
