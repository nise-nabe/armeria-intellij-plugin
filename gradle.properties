# suppress inspection "UnusedProperty" for whole file
kotlin.code.style=official
# Use the Kotlin stdlib bundled with the IntelliJ Platform. Packaging our own
# kotlin-stdlib (2.4.10 vs platform 2.4.0) puts a second copy in the plugin ZIP
# and can fail plugin load in a real IDE with LinkageError / PluginException.
kotlin.stdlib.default.dependency=false

pluginVersion=0.2.1-SNAPSHOT

org.gradle.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.warning.mode=all
org.gradle.vfs.watch=true

# Isolated Projects is validated (all modules compile cleanly under -Dorg.gradle.unsafe.isolated-projects=true).
# Enable as a CI default in a follow-up after confirming test-task compatibility.
# org.gradle.unsafe.isolated-projects=true
